name: Test Build Package (with wrapper)

on:
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y curl file

      - name: Download Termux Packages file
        run: |
          curl -L -o /tmp/Packages https://packages.termux.org/apt/termux-main/dists/stable/main/binary-aarch64/Packages

      - name: Extract deb URLs
        run: |
          CMAKE_DEB_PATH=$(awk '/^Package: cmake$/{flag=1} flag && /^Filename: /{print $2; exit}' /tmp/Packages)
          NINJA_DEB_PATH=$(awk '/^Package: ninja$/{flag=1} flag && /^Filename: /{print $2; exit}' /tmp/Packages)
          EXPAT_DEB_PATH=$(awk '/^Package: libexpat$/{flag=1} flag && /^Filename: /{print $2; exit}' /tmp/Packages)
          echo "CMAKE_DEB_PATH=$CMAKE_DEB_PATH" >> $GITHUB_ENV
          echo "NINJA_DEB_PATH=$NINJA_DEB_PATH" >> $GITHUB_ENV
          echo "EXPAT_DEB_PATH=$EXPAT_DEB_PATH" >> $GITHUB_ENV
          echo "CMake: $CMAKE_DEB_PATH"
          echo "Ninja: $NINJA_DEB_PATH"
          echo "libexpat: $EXPAT_DEB_PATH"

      - name: Download deb files
        run: |
          curl -L -o /tmp/cmake.deb "https://packages.termux.org/apt/termux-main/$CMAKE_DEB_PATH"
          curl -L -o /tmp/ninja.deb "https://packages.termux.org/apt/termux-main/$NINJA_DEB_PATH"
          curl -L -o /tmp/expat.deb "https://packages.termux.org/apt/termux-main/$EXPAT_DEB_PATH"

      - name: Extract cmake
        run: |
          mkdir -p /tmp/cmake_deb && cd /tmp/cmake_deb
          ar x /tmp/cmake.deb && tar -xJf data.tar.xz
          CMAKE_BIN=$(find . -type f -name "cmake" -executable | head -1)
          mkdir -p /tmp/package/bin
          cp "$CMAKE_BIN" /tmp/package/bin/

      - name: Extract ninja
        run: |
          mkdir -p /tmp/ninja_deb && cd /tmp/ninja_deb
          ar x /tmp/ninja.deb && tar -xJf data.tar.xz
          NINJA_BIN=$(find . -type f -name "ninja" -executable | head -1)
          cp "$NINJA_BIN" /tmp/package/bin/

      - name: Extract libexpat
        run: |
          mkdir -p /tmp/expat_deb && cd /tmp/expat_deb
          ar x /tmp/expat.deb && tar -xJf data.tar.xz
          mkdir -p /tmp/package/lib
          find . -name "libexpat*.so*" -type f -exec cp -L {} /tmp/package/lib/ \;
          ls -la /tmp/package/lib/

      - name: Create wrapper script for cmake (without heredoc)
        run: |
          CMAKE_FILE="/tmp/package/bin/cmake"
          if [ -f "$CMAKE_FILE" ]; then
            mv "$CMAKE_FILE" "${CMAKE_FILE}.real"
            echo '#!/system/bin/sh' > "$CMAKE_FILE"
            echo 'export LD_LIBRARY_PATH=$(dirname $0)/../lib:$LD_LIBRARY_PATH' >> "$CMAKE_FILE"
            echo 'exec $(dirname $0)/cmake.real "$@"' >> "$CMAKE_FILE"
            chmod +x "$CMAKE_FILE"
            chmod +x "${CMAKE_FILE}.real"
            echo "Wrapper created"
            cat "$CMAKE_FILE"
          else
            echo "cmake not found"
            exit 1
          fi

      - name: List final package structure
        run: |
          tree /tmp/package || find /tmp/package -type f

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: test-package-with-wrapper
          path: /tmp/package/
