name: Build OLLVM for Android arm64 (Termux)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要构建的分支'
        required: true
        default: 'master'

env:
  ANDROID_NDK_VERSION: r25c
  ANDROID_API: 21
  ANDROID_ABI: arm64-v8a
  INSTALL_DIR: ${{ github.workspace }}/install

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout specified branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install host dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build python3

      - name: Download Android NDK (skip checksum)
        run: |
          NDK_ZIP="android-ndk-${ANDROID_NDK_VERSION}-linux.zip"
          curl -L -o $NDK_ZIP https://dl.google.com/android/repository/$NDK_ZIP
          unzip -q $NDK_ZIP
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-${ANDROID_NDK_VERSION}" >> $GITHUB_ENV

      # 1. 构建宿主 tablegen 工具
      - name: Build host tools (tablegen)
        run: |
          mkdir build-host && cd build-host
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD="" \
            -DLLVM_ENABLE_PROJECTS="clang" \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            ../llvm
          ninja llvm-tblgen clang-tblgen
          echo "LLVM_TABLEGEN=$PWD/bin/llvm-tblgen" >> $GITHUB_ENV
          echo "CLANG_TABLEGEN=$PWD/bin/clang-tblgen" >> $GITHUB_ENV
        working-directory: ${{ github.workspace }}

      # 2. 交叉编译 OLLVM (目标 Android/arm64)
      - name: Configure and build OLLVM for arm64
        run: |
          mkdir build-android && cd build-android
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION=${ANDROID_API} \
            -DCMAKE_ANDROID_ARCH_ABI=${ANDROID_ABI} \
            -DCMAKE_ANDROID_NDK=${ANDROID_NDK_HOME} \
            -DCMAKE_ANDROID_STANDALONE_TOOLCHAIN=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64 \
            -DLLVM_DEFAULT_TARGET_TRIPLE=aarch64-linux-android \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_TABLEGEN=${LLVM_TABLEGEN} \
            -DCLANG_TABLEGEN=${CLANG_TABLEGEN} \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_BUILD_TOOLS=OFF \
            -DCMAKE_INSTALL_PREFIX=${INSTALL_DIR} \
            ../llvm
          ninja -j$(nproc) install/strip
        working-directory: ${{ github.workspace }}

      # 3. 准备打包产物（包含 cmake 和 ninja，动态提取 + wrapper）
      - name: Prepare package with outer directory and extra tools from Termux
        run: |
          # 创建临时打包目录，外层为 ollvm-android-arm64
          mkdir -p package/ollvm-android-arm64
          cp -r ${INSTALL_DIR}/* package/ollvm-android-arm64/

          # ---------- 从 Termux 仓库获取 deb 路径 ----------
          curl -L -o /tmp/Packages https://packages.termux.org/apt/termux-main/dists/stable/main/binary-aarch64/Packages

          CMAKE_DEB_PATH=$(awk '/^Package: cmake$/{flag=1} flag && /^Filename: /{print $2; exit}' /tmp/Packages)
          NINJA_DEB_PATH=$(awk '/^Package: ninja$/{flag=1} flag && /^Filename: /{print $2; exit}' /tmp/Packages)
          EXPAT_DEB_PATH=$(awk '/^Package: libexpat$/{flag=1} flag && /^Filename: /{print $2; exit}' /tmp/Packages)

          echo "CMake deb path: $CMAKE_DEB_PATH"
          echo "Ninja deb path: $NINJA_DEB_PATH"
          echo "libexpat deb path: $EXPAT_DEB_PATH"

          CMAKE_DEB_URL="https://packages.termux.org/apt/termux-main/$CMAKE_DEB_PATH"
          NINJA_DEB_URL="https://packages.termux.org/apt/termux-main/$NINJA_DEB_PATH"
          EXPAT_DEB_URL="https://packages.termux.org/apt/termux-main/$EXPAT_DEB_PATH"

          curl -L -o /tmp/cmake.deb "$CMAKE_DEB_URL"
          curl -L -o /tmp/ninja.deb "$NINJA_DEB_URL"
          curl -L -o /tmp/expat.deb "$EXPAT_DEB_URL"

          # ---------- 提取 cmake ----------
          mkdir -p /tmp/cmake_deb
          cd /tmp/cmake_deb
          ar x /tmp/cmake.deb
          tar -xJf data.tar.xz
          CMAKE_BIN=$(find . -type f -name "cmake" -executable | head -1)
          if [ -z "$CMAKE_BIN" ]; then
            echo "Cannot find cmake binary"
            exit 1
          fi
          cp "$CMAKE_BIN" $OLDPWD/package/ollvm-android-arm64/bin/
          chmod +x $OLDPWD/package/ollvm-android-arm64/bin/cmake
          cd $OLDPWD

          # ---------- 提取 ninja ----------
          mkdir -p /tmp/ninja_deb
          cd /tmp/ninja_deb
          ar x /tmp/ninja.deb
          tar -xJf data.tar.xz
          NINJA_BIN=$(find . -type f -name "ninja" -executable | head -1)
          if [ -z "$NINJA_BIN" ]; then
            echo "Cannot find ninja binary"
            exit 1
          fi
          cp "$NINJA_BIN" $OLDPWD/package/ollvm-android-arm64/bin/
          chmod +x $OLDPWD/package/ollvm-android-arm64/bin/ninja
          cd $OLDPWD

          # ---------- 提取 libexpat（cmake 依赖） ----------
          mkdir -p /tmp/expat_deb
          cd /tmp/expat_deb
          ar x /tmp/expat.deb
          tar -xJf data.tar.xz
          mkdir -p $OLDPWD/package/ollvm-android-arm64/lib
          find . -name "libexpat*.so*" -type f -exec cp -L {} $OLDPWD/package/ollvm-android-arm64/lib/ \;
          cd $OLDPWD
          ls -la package/ollvm-android-arm64/lib/libexpat* || echo "libexpat not found"

          # ---------- 创建 wrapper 脚本（含动态修复权限） ----------
          CMAKE_FILE="package/ollvm-android-arm64/bin/cmake"
          if [ -f "$CMAKE_FILE" ]; then
            mv "$CMAKE_FILE" "${CMAKE_FILE}.real"
            # 确保 cmake.real 有执行权限（即使之前丢失）
            chmod +x "${CMAKE_FILE}.real"
            # 写入 wrapper 脚本，先尝试 chmod +x 再执行
            cat > "$CMAKE_FILE" << 'EOF'
#!/system/bin/sh
REAL_CMAKE=$(dirname $0)/cmake.real
chmod +x "$REAL_CMAKE" 2>/dev/null
export LD_LIBRARY_PATH=$(dirname $0)/../lib:$LD_LIBRARY_PATH
exec "$REAL_CMAKE" "$@"
EOF
            chmod +x "$CMAKE_FILE"
            echo "✅ Wrapper created for cmake with permission fix"
          else
            echo "⚠️  cmake not found, skipping wrapper"
            exit 1
          fi

          # ---------- 处理 clang/clang++ 符号链接 ----------
          cd package/ollvm-android-arm64/bin
          CLANG_VERSION=$(ls clang-* 2>/dev/null | head -1 | sed 's/clang-//')
          if [ -n "$CLANG_VERSION" ]; then
            for f in clang clang++; do
              if [ -L "$f" ]; then
                rm "$f"
                cp "clang-${CLANG_VERSION}" "$f"
                chmod +x "$f"
              fi
            done
          fi
          cd ../../..

          # ---------- 打包 ----------
          tar -czf ollvm-android-arm64.tar.gz -C package ollvm-android-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ollvm-android-arm64
          path: ollvm-android-arm64.tar.gz
