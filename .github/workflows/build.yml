name: Test Termux Extract (cmake & ninja)

on:
  workflow_dispatch:

jobs:
  extract-test:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y curl file

      - name: Download Termux Packages file
        run: |
          curl -L -o Packages https://packages.termux.org/apt/termux-main/dists/stable/main/binary-aarch64/Packages
          echo "Packages file downloaded:"
          head -n 20 Packages

      - name: Extract deb URLs for cmake and ninja
        id: get_urls
        run: |
          CMAKE_PATH=$(awk '/^Package: cmake$/{flag=1} flag && /^Filename: /{print $2; exit}' Packages)
          NINJA_PATH=$(awk '/^Package: ninja$/{flag=1} flag && /^Filename: /{print $2; exit}' Packages)
          echo "CMAKE_PATH=$CMAKE_PATH" >> $GITHUB_ENV
          echo "NINJA_PATH=$NINJA_PATH" >> $GITHUB_ENV
          echo "CMAKE_URL=https://packages.termux.org/apt/termux-main/$CMAKE_PATH" >> $GITHUB_ENV
          echo "NINJA_URL=https://packages.termux.org/apt/termux-main/$NINJA_PATH" >> $GITHUB_ENV
          echo "CMake path: $CMAKE_PATH"
          echo "Ninja path: $NINJA_PATH"

      - name: Download deb files
        run: |
          curl -L -o cmake.deb "$CMAKE_URL"
          curl -L -o ninja.deb "$NINJA_URL"
          ls -lh *.deb
          file cmake.deb
          file ninja.deb

      - name: Extract cmake deb
        run: |
          mkdir cmake_extract
          cd cmake_extract
          ar x ../cmake.deb
          tar -xJf data.tar.xz
          ls -la data/data/com.termux/files/usr/bin/cmake
          file data/data/com.termux/files/usr/bin/cmake

      - name: Extract ninja deb
        run: |
          mkdir ninja_extract
          cd ninja_extract
          ar x ../ninja.deb
          tar -xJf data.tar.xz
          ls -la data/data/com.termux/files/usr/bin/ninja
          file data/data/com.termux/files/usr/bin/ninja

      - name: Copy extracted binaries to a test folder
        run: |
          mkdir -p test-package/bin
          cp cmake_extract/data/data/com.termux/files/usr/bin/cmake test-package/bin/
          cp ninja_extract/data/data/com.termux/files/usr/bin/ninja test-package/bin/
          chmod +x test-package/bin/*
          ls -la test-package/bin/

      - name: Verify binaries are PIE and executable
        run: |
          echo "Check cmake:"
          file test-package/bin/cmake
          echo "Check ninja:"
          file test-package/bin/ninja
          # Try to run --version using qemu-user-static? (optional)
          # For now, just verify they are ELF 64-bit LSB shared object (PIE)

      - name: Upload test package (optional)
        uses: actions/upload-artifact@v4
        with:
          name: test-extracted-tools
          path: test-package/
