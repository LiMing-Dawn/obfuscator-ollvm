name: Build OLLVM for Android arm64 (Termux)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要构建的分支'
        required: true
        default: 'master'

env:
  ANDROID_NDK_VERSION: r25c
  ANDROID_API: 21
  ANDROID_ABI: arm64-v8a
  INSTALL_DIR: ${{ github.workspace }}/install

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout specified branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install host dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build python3

      - name: Download Android NDK (skip checksum)
        run: |
          NDK_ZIP="android-ndk-${ANDROID_NDK_VERSION}-linux.zip"
          curl -L -o $NDK_ZIP https://dl.google.com/android/repository/$NDK_ZIP
          unzip -q $NDK_ZIP
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-${ANDROID_NDK_VERSION}" >> $GITHUB_ENV

      # 1. 构建宿主 tablegen 工具
      - name: Build host tools (tablegen)
        run: |
          mkdir build-host && cd build-host
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD="" \
            -DLLVM_ENABLE_PROJECTS="clang" \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            ../llvm
          ninja llvm-tblgen clang-tblgen
          echo "LLVM_TABLEGEN=$PWD/bin/llvm-tblgen" >> $GITHUB_ENV
          echo "CLANG_TABLEGEN=$PWD/bin/clang-tblgen" >> $GITHUB_ENV
        working-directory: ${{ github.workspace }}

      # 2. 交叉编译 OLLVM (目标 Android/arm64)
      - name: Configure and build OLLVM for arm64
        run: |
          mkdir build-android && cd build-android
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION=${ANDROID_API} \
            -DCMAKE_ANDROID_ARCH_ABI=${ANDROID_ABI} \
            -DCMAKE_ANDROID_NDK=${ANDROID_NDK_HOME} \
            -DCMAKE_ANDROID_STANDALONE_TOOLCHAIN=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64 \
            -DLLVM_DEFAULT_TARGET_TRIPLE=aarch64-linux-android \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_TABLEGEN=${LLVM_TABLEGEN} \
            -DCLANG_TABLEGEN=${CLANG_TABLEGEN} \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_BUILD_TOOLS=OFF \
            -DCMAKE_INSTALL_PREFIX=${INSTALL_DIR} \
            ../llvm
          ninja -j$(nproc) install/strip
        working-directory: ${{ github.workspace }}

      # 3. 准备打包产物（包含 cmake 和 ninja）
      - name: Prepare package with outer directory and extra tools
        run: |
          # 创建临时打包目录
          mkdir -p package/ollvm-android-arm64
          cp -r ${INSTALL_DIR}/* package/ollvm-android-arm64/

          # 下载 arm64 版本的 cmake 和 ninja
          cd package/ollvm-android-arm64/bin

          # 下载 cmake (aarch64)
          CMAKE_VERSION="3.29.3"
          curl -L -o cmake.tar.gz "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-aarch64.tar.gz"
          tar -xzf cmake.tar.gz --strip-components=1 -C . --wildcards '*/bin/cmake' '*/bin/ccmake' '*/bin/ctest' 2>/dev/null || true
          rm -f cmake.tar.gz

          # 下载 ninja (aarch64)
          NINJA_VERSION="1.12.1"
          curl -L -o ninja.zip "https://github.com/ninja-build/ninja/releases/download/v${NINJA_VERSION}/ninja-linux-aarch64.zip"
          unzip -o ninja.zip
          rm -f ninja.zip

          # 处理 clang 符号链接
          CLANG_VERSION=$(ls clang-* 2>/dev/null | head -1 | sed 's/clang-//')
          if [ -n "$CLANG_VERSION" ]; then
            for f in clang clang++; do
              if [ -L "$f" ]; then
                rm "$f"
                cp "clang-${CLANG_VERSION}" "$f"
                chmod +x "$f"
              fi
            done
          fi

          # 给所有可执行文件添加执行权限
          chmod +x cmake ninja clang* lld* 2>/dev/null || true

          cd ../../..

          # 打包（使用 gzip 加速）
          tar -czf ollvm-android-arm64.tar.gz -C package ollvm-android-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ollvm-android-arm64
          path: ollvm-android-arm64.tar.gz
